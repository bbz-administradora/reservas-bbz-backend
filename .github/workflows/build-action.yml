name: Migrate and Deploy

# Este back-end é um processo Fastify de vida longa, publicado no Render.
# Ele NÃO vai para a Vercel: os 7 jobs agendados (src/infra/jobs) vivem dentro
# do processo via toad-scheduler e não sobrevivem a um runtime serverless.
#
# O fluxo é: valida e compila no CI para falhar cedo, aplica as migrations
# pendentes no Supabase e então dispara o deploy no Render, aguardando o
# resultado. O Render compila de novo a partir do git — diferente do
# `vercel deploy --prebuilt`, não existe upload de artefato pronto para um
# serviço Node. O build do CI é portão de qualidade, não o artefato publicado.

on:
  push:
    # Apenas as branches que resolvem para um ambiente. Antes o gatilho era
    # "**", e qualquer feature branch caía no job de deploy com o ambiente
    # vazio.
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-environment:
    name: Resolve environment
    runs-on: ubuntu-latest

    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}

    steps:
      - name: Determine environment from branch
        id: resolve
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" == "main" ]]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == "dev" ]]; then
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
          else
            echo "Branch '$BRANCH' não mapeia para nenhum ambiente." >&2
            exit 1
          fi

  build:
    name: Lint and build
    needs: resolve-environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Só ESLint. `lint:prettier:check` reprova em centenas de arquivos que já
      # estavam fora do padrão antes deste workflow — ligar aqui deixaria o CI
      # permanentemente vermelho. Formatar o repositório inteiro é tarefa à
      # parte.
      - name: Lint
        run: npm run lint:eslint:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f build/server.js

  migrate-and-deploy:
    name: Migrate database and deploy
    needs:
      - resolve-environment
      - build
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-environment.outputs.env_name }}

    concurrency:
      group: migrate-deploy-${{ needs.resolve-environment.outputs.env_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Link Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Deixa visível no log o que vai rodar antes de rodar. Se aparecer o
      # baseline aqui, pare: significa que o ambiente alvo não recebeu
      # `supabase migration repair --status applied <versao-do-baseline>`, e o
      # push tentaria recriar objetos que já existem.
      - name: Show pending migrations
        run: supabase db push --dry-run --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Run pending migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Trigger Render deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          response=$(curl -sS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')

          deploy_id=$(echo "$response" | jq -r '.id // empty')

          if [[ -z "$deploy_id" ]]; then
            echo "Falha ao disparar o deploy. Resposta da API:" >&2
            echo "$response" >&2
            exit 1
          fi

          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Deploy disparado: $deploy_id"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

      # Sem esta espera o workflow ficaria verde mesmo com o deploy falhando no
      # Render, porque o POST acima só enfileira.
      - name: Wait for deploy to go live
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail

          while true; do
            status=$(curl -sS \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')

            case "$status" in
              live)
                echo "Deploy concluído: live"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Deploy terminou com status '$status'." >&2
                exit 1
                ;;
              *)
                echo "status atual: $status"
                sleep 15
                ;;
            esac
          done
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}

name: Migrate and Deploy

# O deploy é feito na Vercel pelo CI, no mesmo desenho do FlowBBZ: o CI é o
# único que publica. A integração Git da Vercel fica desligada pelo
# `git.deploymentEnabled: false` no vercel.json — sem isso, cada push na main
# geraria dois deploys de produção concorrentes, um do CI e um do GitHub.
#
# O fluxo é: valida e compila para falhar cedo, aplica as migrations pendentes
# no Supabase e então publica na Vercel a partir do output pré-construído.

on:
  push:
    # Apenas as branches que resolvem para um ambiente. Antes o gatilho era
    # "**", e qualquer feature branch caía no job de deploy com o ambiente
    # vazio.
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-environment:
    name: Resolve environment
    runs-on: ubuntu-latest

    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      vercel_target_env: ${{ steps.resolve.outputs.vercel_target_env }}
      vercel_prod_flag: ${{ steps.resolve.outputs.vercel_prod_flag }}

    steps:
      - name: Determine environment from branch
        id: resolve
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" == "main" ]]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
            echo "vercel_target_env=production" >> "$GITHUB_OUTPUT"
            echo "vercel_prod_flag=--prod" >> "$GITHUB_OUTPUT"

          elif [[ "$BRANCH" == "dev" ]]; then
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
            echo "vercel_target_env=preview" >> "$GITHUB_OUTPUT"
            echo "vercel_prod_flag=" >> "$GITHUB_OUTPUT"

          else
            echo "Branch '$BRANCH' não mapeia para nenhum ambiente." >&2
            exit 1
          fi

  build:
    name: Lint and build
    needs: resolve-environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Só ESLint. `lint:prettier:check` reprova em centenas de arquivos que já
      # estavam fora do padrão antes deste workflow — ligar aqui deixaria o CI
      # permanentemente vermelho. Formatar o repositório inteiro é tarefa à
      # parte.
      - name: Lint
        run: npm run lint:eslint:check

      # O nome de um job e contrato entre o registry TypeScript, a migration de
      # runtime, jobs.job_definition e a rota. Divergir nao quebra a
      # compilacao: quebra o disparo, em silencio, de madrugada.
      - name: Check job registry
        run: npm run jobs:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f build/server.js

  migrate-and-deploy:
    name: Migrate database and deploy
    needs:
      - resolve-environment
      - build
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-environment.outputs.env_name }}

    concurrency:
      group: migrate-deploy-${{ needs.resolve-environment.outputs.env_name }}
      cancel-in-progress: false

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Link Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Deixa visível no log o que vai rodar antes de rodar. Se aparecer o
      # baseline aqui, pare: significa que o ambiente alvo não recebeu
      # `supabase migration repair --status applied <versao-do-baseline>`, e o
      # push tentaria recriar objetos que já existem.
      - name: Show pending migrations
        run: supabase db push --dry-run --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Run pending migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Install Vercel CLI
        run: npm install --global vercel@50.5.0

      # Com os IDs de volta como secrets o log os mascara, e um valor colado
      # torto volta a ser invisível. Este passo confere o formato sem expor o
      # conteúdo — prefixo esperado e ausência de espaço ou quebra de linha, que
      # é o que transforma um ID certo em "Could not retrieve Project Settings"
      # no `pull`, sem nenhuma pista no log.
      - name: Check Vercel secrets shape
        run: |
          fail=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            value="${!name}"
            case "$name" in
              VERCEL_ORG_ID) prefix=team_ ;;
              VERCEL_PROJECT_ID) prefix=prj_ ;;
            esac

            if [[ "$value" =~ [[:space:]] ]]; then
              echo "$name: ${#value} caracteres - ERRO: contém espaço ou quebra de linha"
              fail=1
            elif [[ "$value" != "$prefix"* ]]; then
              echo "$name: ${#value} caracteres - ERRO: não começa com $prefix"
              fail=1
            else
              echo "$name: ${#value} caracteres - ok"
            fi
          done
          exit $fail

      # Duas perguntas diferentes, e as duas precisam de sim. Esta aqui é sobre
      # permissão: este token enxerga este projeto? É o que o `pull` precisa e
      # não conta quando falha.
      #   200 -> token enxerga o projeto
      #   401 -> token inválido, revogado ou expirado
      #   403 -> token válido, sem permissão neste projeto
      #   404 -> token válido, com escopo de outro projeto ou outro time
      - name: Check Vercel token access to project
        run: |
          status=$(curl -sS -o resposta.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")

          echo "GET /v9/projects/<id> -> HTTP $status"

          if [[ "$status" == "200" ]]; then
            echo "Projeto visível para o token: $(jq -r .name resposta.json)"
          else
            jq -c '.error // .' resposta.json
            rm -f resposta.json
            exit 1
          fi

          rm -f resposta.json
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}

      # `--scope` explícito porque a CLI, sem ele, resolve o time a partir do
      # usuário dono do token — e um token com escopo (`vcp_`) não tem usuário,
      # que é o mesmo 404 do `whoami`. A chamada REST do passo anterior passa com
      # `teamId` na query e prova que o token enxerga o projeto; aqui damos à CLI
      # a mesma informação em vez de deixá-la deduzir.
      # A outra pergunta: existe um usuário por trás deste token? Um token com
      # escopo de projeto responde 404 aqui e 200 no passo acima.
      #
      # Isto NÃO reprova o token. A CLI 50.5.0 trabalha com token sem usuário;
      # a 59.23.2 carrega o dono no arranque e morre com "Not able to load
      # user". É a versão da CLI que decide, não o token — foi o que este
      # workflow levou uma tarde para descobrir.
      #
      # Também não confunda este 404 com token inválido: quem responde por
      # validade é o passo anterior. Este responde por tipo.
      # Informativo, nunca bloqueante: um token sem usuário responde 404 aqui e
      # ainda assim funciona na 50.5.0. Serve para registrar no log qual é o
      # caso, não para reprovar o job.
      - name: Check Vercel token works with the CLI
        continue-on-error: true
        run: vercel whoami --token="${{ secrets.VERCEL_ACCESS_TOKEN }}"

      # Testa diretamente a hipótese de que a pasta .vercel chega ao runner antes
      # do pull. Quem cria essa pasta é o próprio `vercel pull`, e só depois de
      # conseguir ler as Project Settings — então aqui ela não deveria existir.
      - name: Check for .vercel before pull
        run: |
          echo "--- find . -name .vercel ---"
          find . -name .vercel -not -path './node_modules/*' -print

          if [ -e .vercel ]; then
            echo "EXISTE no runner antes do pull:"
            ls -la .vercel
          else
            echo "NAO existe no runner antes do pull"
          fi

          echo "--- git ls-files, o que o checkout trouxe ---"
          git ls-files | grep -i vercel || echo "nenhum caminho com 'vercel' rastreado alem do abaixo"

      - name: Pull Vercel project settings
        run: |
          if [[ "${{ needs.resolve-environment.outputs.vercel_target_env }}" == "production" ]]; then
            vercel pull --yes \
              --environment="production" \
              --token="${{ secrets.VERCEL_ACCESS_TOKEN }}" --scope="$VERCEL_ORG_ID"
          else
            vercel pull --yes \
              --environment="preview" \
              --git-branch="${{ github.ref_name }}" \
              --token="${{ secrets.VERCEL_ACCESS_TOKEN }}" --scope="$VERCEL_ORG_ID"
          fi

      - name: Debug - variáveis puxadas
        run: grep -o '^[A-Z_]*=' .vercel/.env.*.local

      - name: Debug - verificar .env comitado
        run: |
          if [ -f .env ]; then
            echo "⚠️ .env existe no checkout desta branch"
            ls -la .env
          else
            echo "OK: .env não existe"
          fi

      - name: Debug - checar se valores existem (sem expor)
        run: |
          while IFS='=' read -r key value; do
            [[ "$key" =~ ^[A-Z_]+$ ]] || continue
            echo "$key: ${#value} caracteres"
          done < .vercel/.env.*.local

      - name: Build project
        run: |
          vercel build \
            ${{ needs.resolve-environment.outputs.vercel_prod_flag }} \
            --token="${{ secrets.VERCEL_ACCESS_TOKEN }}" --scope="$VERCEL_ORG_ID"

      - name: Deploy prebuilt output
        run: |
          vercel deploy \
            --prebuilt \
            ${{ needs.resolve-environment.outputs.vercel_prod_flag }} \
            --token="${{ secrets.VERCEL_ACCESS_TOKEN }}" --scope="$VERCEL_ORG_ID"

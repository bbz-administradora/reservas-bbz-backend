services:
  database:
    container_name: 'bbz-postgres-v16-dev'
    image: 'postgres:16-alpine'
    env_file:
      - '../../.env'
    ports:
      - '25432:5432'
    volumes:
      - 'bbz-postgres-v16-data:/var/lib/postgresql/data'

volumes:
  bbz-postgres-v16-data:
    name: 'bbz-postgres-v16-data'
